<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HarpHub | Organiza tu Aprendizaje Musical</title>
    <meta name="description" content="Centraliza tus tabs, videos y teoría musical en un solo lugar. La herramienta definitiva para harmonicistas y músicos que buscan organizar su camino de aprendizaje." />
    <meta name="keywords" content="armónica, harmonica, tabs armónica, aprender música, blues harmonica, teoría musical, organización musical, HarpHub" />
    <meta name="author" content="HarpHub Team" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://harphub.app/" />
    <meta property="og:title" content="HarpHub | Organiza tu Aprendizaje Musical" />
    <meta property="og:description" content="La aplicación definitiva para organizar tu conocimiento musical. Carga contenido, crea tu propio camino y potencia tu estudio." />
    <meta property="og:image" content="/assets/hero-bg.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://harphub.app/" />
    <meta property="twitter:title" content="HarpHub | Organiza tu Aprendizaje Musical" />
    <meta property="twitter:description" content="Centraliza tus tabs, videos y teoría musical. Potencia tu estudio con herramientas profesionales de Blues." />
    <meta property="twitter:image" content="/assets/hero-bg.png" />

    <!-- PWA & Mobile Capabilities -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="HarpHub" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="alternate icon" type="image/png" href="/icon-192.png" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // PWA Service Worker Registration & Install Prompt Capture
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch((err) => {
            console.warn('ServiceWorker registration error:', err);
          });
        });
      }
      window.addEventListener('beforeinstallprompt', (e) => {
        window.deferredPWAInstallPrompt = e;
        window.dispatchEvent(new CustomEvent('pwa-installable'));
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
