<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  
  <!-- App Background -->
  <rect width="512" height="512" rx="115" fill="url(#bg)" />
  
  <!-- Harmonica Base Shadow -->
  <rect x="76" y="206" width="360" height="110" rx="20" fill="#0f172a" opacity="0.6" />
  
  <!-- Harmonica Plate -->
  <rect x="76" y="196" width="360" height="110" rx="20" fill="url(#gold)" stroke="#fef3c7" stroke-width="4" />
  
  <!-- Center Groove -->
  <line x1="96" y1="208" x2="416" y2="208" stroke="#78350f" stroke-width="3" stroke-linecap="round" />
  <line x1="96" y1="294" x2="416" y2="294" stroke="#78350f" stroke-width="3" stroke-linecap="round" />
  
  <!-- Harmonica Holes (10 holes) -->
  <g fill="#020617">
    <rect x="106" y="226" width="20" height="50" rx="4" />
    <rect x="136" y="226" width="20" height="50" rx="4" />
    <rect x="166" y="226" width="20" height="50" rx="4" />
    <rect x="196" y="226" width="20" height="50" rx="4" />
    <rect x="226" y="226" width="20" height="50" rx="4" />
    <rect x="256" y="226" width="20" height="50" rx="4" />
    <rect x="286" y="226" width="20" height="50" rx="4" />
    <rect x="316" y="226" width="20" height="50" rx="4" />
    <rect x="346" y="226" width="20" height="50" rx="4" />
    <rect x="376" y="226" width="20" height="50" rx="4" />
  </g>
  
  <!-- Music Waves -->
  <path d="M 216 130 Q 256 100 296 130" fill="none" stroke="#60a5fa" stroke-width="6" stroke-linecap="round" opacity="0.8" />
  <path d="M 186 100 Q 256 60 326 100" fill="none" stroke="#3b82f6" stroke-width="6" stroke-linecap="round" opacity="0.6" />
  
  <!-- Brand text -->
  <text x="256" y="370" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="38" letter-spacing="4">HARPHUB</text>
  <text x="256" y="405" text-anchor="middle" fill="#60a5fa" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="16" letter-spacing="6">STUDIO</text>
</svg>
